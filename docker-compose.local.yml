volumes:
  arkumu_local_postgres_data: {}
  arkumu_local_postgres_data_backups: {}
  arkumu_local_redis_data: {}
  minio_data: {}

networks:
  arkumu_network:
    driver: bridge

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: web-run-stage
    image: arkumu_local_django
    container_name: arkumu_local_django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app:z
      - ../arkumu-metadata:/arkumu-metadata:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '127.0.0.1:8000:8000'  # Only bind to localhost
    command: /start
    environment:
      # DISABLE_CACHE: 1 = cache disabled (no caching), 0 = cache enabled (with caching)
      - DISABLE_CACHE=0
      - WAIT_FOR_IT_TIMEOUT=${WAIT_FOR_IT_TIMEOUT:-90}
      - OAI_S3_ROSETTA_BASE_FUK=/rosetta/fudk/sandbox/input/arkumu/daten
      - OAI_S3_ROSETTA_BASE_RSH=/rosetta/rsh/sandbox/input/arkumu/daten
      - OAI_S3_ROSETTA_BASE_DET=/rosetta/hfmdt/sandbox/input/arkumu/daten
      - OAI_ROSETTA_CURATED_PREFIX_HMT=/rosetta/hfmt/sandbox/input/arkumu/daten
      - OAI_ROSETTA_CURATED_PREFIX_KHM=/rosetta/khm/sandbox/input/arkumu/daten
      - PROJECT_SNAPSHOT_ORG_CODES=${PROJECT_SNAPSHOT_ORG_CODES:-}
      - PROJECT_SNAPSHOT_FORCE_ORG_GRAPHS=${PROJECT_SNAPSHOT_FORCE_ORG_GRAPHS:-false}
    networks:
      - arkumu_network

  postgres:
    build:
      secrets:
        - postgres_passwd
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: arkumu_production_postgres
    container_name: arkumu_local_postgres
    restart: unless-stopped
    volumes:
      - arkumu_local_postgres_data:/var/lib/postgresql/data
      - arkumu_local_postgres_data_backups:/backups
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: postgres_passwd
    env_file:
      - ./.envs/.local/.postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # No ports exposed - only accessible internally
    ports:
      - "127.0.0.1:8432:5432"
    networks:
      - arkumu_network

  minio:
    secrets:
      - minio_root_passwd
    image: minio/minio:latest
    container_name: arkumu_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9020:9020"  # Only bind to localhost
      - "127.0.0.1:9021:9021"  # Only bind to localhost
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_root_passwd
      MINIO_API_ALLOW_CORS_ORIGIN: "*"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9021"
      MINIO_DOMAIN_NAME: "localhost:9020"
      MINIO_LOGGER: "console"
      MINIO_LOGGER_LEVEL: "debug"
      MINIO_CORS_ALLOW_ORIGINS: "*"
      MINIO_CORS_ALLOW_METHODS: "GET,PUT,POST,DELETE,OPTIONS"
      MINIO_CORS_ALLOW_HEADERS: "*"
      MINIO_CORS_EXPOSE_HEADERS: "ETag"
      MINIO_CORS_MAX_AGE_SECONDS: "3600"
    command: server /data --console-address ":9021"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9020/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - arkumu_network

  redis:
    image: "redis:latest"
    container_name: arkumu_redis
    restart: unless-stopped
    volumes:
      - arkumu_local_redis_data:/data
      - ./compose/local/redis/redis-init.sh:/usr/local/bin/redis-init.sh:ro
    ports:
      - "127.0.0.1:6379:6379"  # Only bind to localhost
    networks:
      - arkumu_network
    command: /usr/local/bin/redis-init.sh

  huey:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: worker-run-stage
    image: arkumu_local_huey
    container_name: arkumu_local_huey
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - .:/app:z
      - ../arkumu-metadata:/arkumu-metadata:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment:
      WAIT_FOR_IT_TIMEOUT: ${WAIT_FOR_IT_TIMEOUT:-90}
      OAI_S3_ROSETTA_BASE_FUK: /rosetta/fudk/sandbox/input/arkumu/daten
      OAI_S3_ROSETTA_BASE_RSH: /rosetta/rsh/sandbox/input/arkumu/daten
      OAI_S3_ROSETTA_BASE_DET: /rosetta/hfmdt/sandbox/input/arkumu/daten
      OAI_ROSETTA_CURATED_PREFIX_HMT: /rosetta/hfmt/sandbox/input/arkumu/daten
      OAI_ROSETTA_CURATED_PREFIX_KHM: /rosetta/khm/sandbox/input/arkumu/daten
      PROJECT_SNAPSHOT_ORG_CODES: ${PROJECT_SNAPSHOT_ORG_CODES:-}
      PROJECT_SNAPSHOT_FORCE_ORG_GRAPHS: ${PROJECT_SNAPSHOT_FORCE_ORG_GRAPHS:-false}
    command: /bin/sh -c "python manage.py run_huey"
    # No ports exposed - only accessible internally
    networks:
      - arkumu_network

  #########################################################################################
  # The following node service is ONLY needed for CUSTOMIZING Tailwind/DaisyUI styles.
  # Enable this ONLY when you want to:
  # - Change colors, fonts, or visual design
  # - Create custom CSS components
  # - Modify DaisyUI themes
  # - Add new Tailwind utility classes
  #
  # You DON'T need this for:
  # - Backend development (Django/Python)
  # - Using existing DaisyUI components as-is
  # - Database or functionality changes
  # - Translation updates
  #
  # To enable: uncomment the node service below and run:
  # docker compose -f docker-compose.local.yml up node

  node:
    image: node:latest
    container_name: arkumu_node_tailwind
    restart: unless-stopped
    depends_on:
      - django
    working_dir: /app/theme/static_src
    volumes:
      - .:/app:z
    command: /bin/sh -c "npm install && npm run dev"
    tty: true
    # No ports exposed - only accessible internally
    networks:
      - arkumu_network
secrets:
  minio_root_passwd:
    environment: MINIO_ROOT_PASSWORD
  postgres_passwd:
    environment: POSTGRES_PASSWORD
